  latency_benchmarks_published: true
  latency_benchmarks_url: https://docs.activefence.com/index.html
  note: >-
    Alice publishes p50/p90 server-side latency benchmarks per media type (see
    conventions/activefence-conventions.yml) but no availability commitment. The benchmarks are
    described as a "general benchmark", not a contractual target.
