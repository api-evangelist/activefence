generated: '2026-08-06'
method: searched
source: https://docs.activefence.com/openapi.json + https://alice.io/sitemap.xml
summary: >-
  Alice publishes an API contract but no operational-transparency surface around it. There is no
  status page, no deprecation policy, no changelog or release-notes page, no published SLA, and
  no roadmap. Version is expressed only as a URI path prefix and the spec's own info.version.
  The one lifecycle commitment the provider does publish in writing is the 12-hour grace window
  on a regenerated API key.
versioning:
  scheme: uri-path
  current: v3
  spec_version: 3.0.0
  prefixes_in_use:
  - {prefix: /v3/, product: ActiveFamily (content, users, collections, flags, api keys)}
  - {prefix: /sync/v3/, product: ActiveFamily synchronous variants}
  - {prefix: /v1/, product: WonderFence message evaluation}
  - {prefix: /redteam/, product: WonderBuild assessments (unversioned)}
  docs: https://docs.activefence.com/index.html
  note: >-
    Version prefixes are inconsistent across the two product families and the WonderBuild
    surface carries no version segment at all.
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  evidence: >-
    No deprecation or sunset language in the OpenAPI document; no operation carries
    deprecated: true; no /deprecation, /sunset or /changelog page in the alice.io sitemap
    (521 URLs).
credential_lifecycle:
  api_key_rotation_grace: 12 hours
  description: >-
    Regenerating an API key overrides the current one, but the superseded key continues to be
    accepted for a further 12 hours so a caller can roll over without downtime. After 12 hours
    requests using the old key are rejected with 401. Deleting a key takes effect immediately.
  source: https://docs.activefence.com/index.html#section/Authentication
