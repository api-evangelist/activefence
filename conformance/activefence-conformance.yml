summary: >-
  Alice (formerly ActiveFence) publishes two audited security certifications and claims alignment
  with a set of AI-governance frameworks that are the subject matter of its own products. The
  cross-cutting API standards picture is thin: OpenAPI 3.0.0 and TLS are the only technical
  standards the surface conforms to. No OAuth, no OIDC, no RFC 9457, no RFC 8594, no
  RFC 9116 security.txt, no RFC 8615 well-known documents.
