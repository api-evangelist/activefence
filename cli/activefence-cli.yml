description: >-
  Alice's (formerly ActiveFence's) first-party open-source command-line security scanner for AI
  agent skill files. It statically inspects skill bundles — Claude Code skills and equivalents —
  for dangerous or malicious behavior before an agent loads them. Released publicly after Alice
  reported catching malicious OpenClaw skills in use by roughly 6,000 users.
scope_note: >-
  Caterpillar is a standalone agent-security tool, not a CLI wrapper around the Alice REST API.
  Alice publishes no CLI for the api.alice.io moderation/guardrail endpoints; those are consumed
  through the Python and TypeScript SDKs in packages/activefence-packages.yml.
