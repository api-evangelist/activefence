aid: activefence
name: ActiveFence
description: >-
  ActiveFence — now operating as Alice — is an AI security, safety and trust & safety company
  headquartered in New York and Tel Aviv. It sells two product families through one REST API at
  api.alice.io: ActiveFamily (ActiveScore automated detection plus the ActiveOS moderation
  workbench) for user-generated-content trust and safety across text, image, video and audio in
  120+ languages and 20+ abuse areas; and WonderSuite for generative-AI protection — WonderBuild
  (pre-deployment red teaming and adversarial assessment of models, apps and agents), WonderFence
  (real-time runtime guardrails that evaluate prompts and responses for prompt injection,
  jailbreaks, PII leakage and policy violations) and WonderCheck (ongoing post-launch evaluation
  and drift detection). The API offers synchronous endpoints for low-latency moderation and
  asynchronous endpoints that acknowledge receipt and post results back to a customer-configured
  callback URL, plus configurable action webhooks fired from the ActiveOS moderation view or an
  automated workflow. Authentication is a single af-api-key header issued from the platform
  console; the default rate limit is 50 requests per second. First-party SDKs ship for Python
  (wonderfence-sdk) and TypeScript (@alice-io/wonderfence-ts-sdk), with a Parlant integration and
  the open-source Caterpillar agent-skill security scanner. Alice is SOC 2 and ISO 27001 certified.
