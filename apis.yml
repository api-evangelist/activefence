apis:
- name: Alice API (formerly ActiveFence)
  description: >-
    Single REST API covering both Alice product families. ActiveFamily endpoints accept text,
    image, video and audio items — plus users, collections and user flags — and return per-violation
    risk scores between 0.1 and 1 across abuse areas such as hate speech, harassment, child abuse,
    self-harm, adult content and unauthorised weapon sales. Text and image have synchronous
    variants (p50 ~100ms text / ~1s image); video and audio are asynchronous and post results to a
    callback URL. WonderFence exposes a message-evaluation endpoint for GenAI prompt/response
    guardrails, and WonderBuild exposes red-team assessment listing and run operations. API-key
    management (create, list, delete) is also exposed over the API.
  humanURL: https://docs.activefence.com/index.html
  baseURL: https://api.alice.io
